services:
  neo4j:
    image: neo4j:2025
    container_name: neo4j
    restart: always

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/1234
      NEO4J_dbms_security_auth__minimum__password__length: 4

    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  neo4j-data:
  neo4j-logs: